<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOB Index</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'SF Mono', 'Consolas', 'Courier New', monospace; color: #c0c0c0; padding: 20px 24px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 1px solid #333; padding-bottom: 16px; }
  .title { font-size: 22px; font-weight: 700; color: #e8e8e8; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: #888; margin-top: 4px; }
  .update-label { font-size: 12px; color: #888; text-align: right; }
  .update-date { font-size: 15px; color: #c0c0c0; }
  .selector { display: flex; gap: 4px; margin-bottom: 16px; }
  .selector button { background: transparent; color: #c0c0c0; border: 1px solid #333; padding: 5px 14px; font-size: 13px; font-family: inherit; cursor: pointer; border-radius: 3px; }
  .selector button.active { font-weight: 700; color: #000; }
  .stats { display: flex; gap: 32px; margin-bottom: 20px; font-size: 14px; }
  .stats .value { font-weight: 600; font-size: 20px; }
  .stats .delta { font-size: 13px; margin-left: 6px; }
  .label { color: #888; }
  .blue { color: #04adff; }
  .green { color: #22c55e; }
  .red { color: #ef4444; }
  .section-title { font-size: 12px; color: #888; margin-bottom: 8px; margin-top: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .chart-container { position: relative; margin-bottom: 8px; height: 220px; }
  .chart-container.short { height: 180px; }
  .footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid #333; font-size: 12px; color: #888; display: flex; justify-content: space-between; }
  .loading { display: flex; align-items: center; justify-content: center; height: 80vh; color: #888; font-size: 14px; }
  canvas { max-width: 100%; }
</style>
</head>
<body>

<div id="app" class="loading">Loading index data...</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQnzcwluHeuSLgz9h2E_iZ9V7w4c7SvCqqyCcw9RGsGin79sC1h3D0nHhNcd4Hu05M_UOn1t0T01E5q/pub?output=csv";

const COLORS = {
  idx_1d: "#f59e0b",
  idx_3d: "#a78bfa",
  idx_5d: "#04adff",
};
const LABELS = { idx_1d: "1-Day", idx_3d: "3-Day", idx_5d: "5-Day" };

let chartIndex = null;
let chartCount = null;
let currentPeriod = "idx_5d";
let allData = [];

function formatPct(v) {
  if (v === null || v === undefined || isNaN(v)) return "";
  return (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
}

async function loadData() {
  try {
    const resp = await fetch(SHEET_CSV_URL);
    const csvText = await resp.text();
    const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    allData = parsed.data.map(row => ({
      date: row["Date"] || "",
      count: parseInt(row["Qualifier Count"]) || 0,
      idx_1d: row["Index 1d"] ? parseFloat(row["Index 1d"]) * 100 : null,
      idx_3d: row["Index 3d"] ? parseFloat(row["Index 3d"]) * 100 : null,
      idx_5d: row["Index 5d"] ? parseFloat(row["Index 5d"]) * 100 : null,
      symbols: row["Symbols"] || "",
    }));
    renderApp();
  } catch (e) {
    document.getElementById("app").innerHTML = '<div class="loading" style="color:#ef4444;">Failed to load data: ' + e.message + '</div>';
  }
}

function renderApp() {
  const latest = allData[allData.length - 1];
  const prev = allData.length > 1 ? allData[allData.length - 2] : null;
  const countDelta = prev ? latest.count - prev.count : 0;
  const latestIdx = latest[currentPeriod];
  const periodLabel = LABELS[currentPeriod];
  const periodColor = COLORS[currentPeriod];

  let deltaHtml = "";
  if (countDelta !== 0) {
    const dc = countDelta > 0 ? "green" : "red";
    deltaHtml = '<span class="delta ' + dc + '">' + (countDelta > 0 ? "+" : "") + countDelta + '</span>';
  }

  let idxHtml = "";
  if (latestIdx !== null && latestIdx !== undefined) {
    const ic = latestIdx >= 0 ? "green" : "red";
    idxHtml = '<div><span class="label">' + periodLabel + ' </span><span class="value ' + ic + '">' + formatPct(latestIdx) + '</span></div>';
  }

  const buttons = ["idx_1d", "idx_3d", "idx_5d"].map(k => {
    const active = k === currentPeriod ? " active" : "";
    const style = k === currentPeriod ? 'background:' + COLORS[k] + ';border-color:' + COLORS[k] + ';' : '';
    return '<button class="' + active + '" style="' + style + '" onclick="switchPeriod(\'' + k + '\')">' + LABELS[k] + '</button>';
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div>
        <div class="title">LOB Index</div>
        <div class="subtitle">Bounce Profile + Outside Envelope · Equal-weight avg return of T-1 qualifiers</div>
      </div>
      <div>
        <div class="update-label">Last update</div>
        <div class="update-date">${latest.date}</div>
      </div>
    </div>

    <div class="selector">${buttons}</div>

    <div class="stats">
      <div><span class="label">Qualifiers </span><span class="value blue">${latest.count}</span>${deltaHtml}</div>
      ${idxHtml}
      <div><span class="label">Sessions </span><span>${allData.length}</span></div>
    </div>

    <div class="section-title">${periodLabel} Return Index</div>
    <div class="chart-container"><canvas id="indexChart"></canvas></div>

    <div class="section-title">Qualifier Count</div>
    <div class="chart-container short"><canvas id="countChart"></canvas></div>

    <div class="footer">
      <span>Screen: 52wk ≥200% OR StdDev ≥20% · Outside 20w/20m EMA envelope</span>
      <span>~1040 All Liquid Stocks</span>
    </div>
  `;

  renderCharts();
}

function renderCharts() {
  const labels = allData.map(d => {
    const parts = d.date.split("-");
    return parseInt(parts[1]) + "/" + parseInt(parts[2]);
  });

  const indexValues = allData.map(d => d[currentPeriod]);
  const countValues = allData.map(d => d.count);
  const periodColor = COLORS[currentPeriod];

  // Index chart
  if (chartIndex) chartIndex.destroy();
  const ctxIdx = document.getElementById("indexChart").getContext("2d");
  chartIndex = new Chart(ctxIdx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: indexValues,
        borderColor: periodColor,
        backgroundColor: periodColor + "33",
        borderWidth: 2,
        pointRadius: 3,
        pointBackgroundColor: "#0a0a0a",
        pointBorderColor: periodColor,
        pointBorderWidth: 2,
        pointHoverRadius: 5,
        spanGaps: false,
        tension: 0.1,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#141414",
          borderColor: "#333",
          borderWidth: 1,
          titleColor: "#e8e8e8",
          bodyColor: "#c0c0c0",
          titleFont: { family: "'SF Mono', 'Consolas', monospace", size: 12 },
          bodyFont: { family: "'SF Mono', 'Consolas', monospace", size: 11 },
          callbacks: {
            label: ctx => formatPct(ctx.parsed.y),
            afterBody: function(items) {
              const idx = items[0].dataIndex;
              const row = allData[idx];
              const lines = [];
              if (row.idx_1d !== null) lines.push("1d: " + formatPct(row.idx_1d));
              if (row.idx_3d !== null) lines.push("3d: " + formatPct(row.idx_3d));
              if (row.idx_5d !== null) lines.push("5d: " + formatPct(row.idx_5d));
              lines.push("Count: " + row.count);
              return lines;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: "#888", font: { family: "'SF Mono', 'Consolas', monospace", size: 11 }, maxTicksLimit: 12 },
          grid: { color: "#1e1e1e", drawBorder: false },
        },
        y: {
          ticks: {
            color: "#888",
            font: { family: "'SF Mono', 'Consolas', monospace", size: 11 },
            callback: v => formatPct(v),
          },
          grid: { color: "#1e1e1e", drawBorder: false },
        }
      },
      annotation: {
        annotations: {
          zeroLine: { type: "line", yMin: 0, yMax: 0, borderColor: "#444", borderDash: [3, 3], borderWidth: 1 }
        }
      }
    }
  });

  // Count chart
  if (chartCount) chartCount.destroy();
  const ctxCnt = document.getElementById("countChart").getContext("2d");
  chartCount = new Chart(ctxCnt, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        data: countValues,
        backgroundColor: "rgba(4, 173, 255, 0.6)",
        borderRadius: 2,
        maxBarThickness: 14,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#141414",
          borderColor: "#333",
          borderWidth: 1,
          titleColor: "#e8e8e8",
          bodyColor: "#c0c0c0",
          titleFont: { family: "'SF Mono', 'Consolas', monospace", size: 12 },
          bodyFont: { family: "'SF Mono', 'Consolas', monospace", size: 11 },
          callbacks: {
            afterBody: function(items) {
              const idx = items[0].dataIndex;
              const row = allData[idx];
              if (row.symbols) return [row.symbols.substring(0, 120) + (row.symbols.length > 120 ? "..." : "")];
              return [];
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: "#888", font: { family: "'SF Mono', 'Consolas', monospace", size: 11 }, maxTicksLimit: 12 },
          grid: { display: false },
        },
        y: {
          ticks: { color: "#888", font: { family: "'SF Mono', 'Consolas', monospace", size: 11 } },
          grid: { color: "#1e1e1e", drawBorder: false },
          beginAtZero: false,
        }
      }
    }
  });
}

function switchPeriod(p) {
  currentPeriod = p;
  renderApp();
}

loadData();
</script>
</body>
</html>
